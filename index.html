<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- FIREBASE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-analytics.js";
    import {
      getFirestore, collection, addDoc, getDocs, serverTimestamp, Timestamp, query, where
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    // 🔧 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDd6uaoLk-6BDL7b4NggCYQz5NErUzFFWk",
      authDomain: "ithriveincas.firebaseapp.com",
      projectId: "ithriveincas",
      storageBucket: "ithriveincas.firebasestorage.app",
      messagingSenderId: "873460211632",
      appId: "1:873460211632:web:015b40f2e4f08829458075",
      measurementId: "G-8QMJE6H7H2"
    };

    // 🔌 Init Firebase
    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const db = getFirestore(app);

    // ——— TEACHER MAP (All Caps) ———
    const teacherMap = {
      Main: [
        "REYNALDO","SANDRA","RONA","MAR","MERCY","NELIA","ISHTIN","NOELYN","FENDIE","SHEILOU","JOHNY","FAE","LALAINE","LOVELY","JEROME","CLARENCE","ECO","ANGE","CLAUDE",
        "AIRLYN","BABY JANE","BARREN","CHRISLYN","CINDY","CRISTINA","DAWN","EDCEL","EDZEILEN","FELINA","FERNAND",
        "GENEREI","GRACHEL","IVETTE","JANIEL","JANZEN","JAYHARD","JERICO","JEROME",
        "JUSTIN",
        "KARREN","KING","LALAINE","MARIELLE","MARY JOY","MAYBELYN","PRINCESS","RANNIE","RAQUEL","REGHIE","RICA","ROCHELLE","SHINE","STEFFANIE"
      ],
      South: [
        "EDWIN","LYKA","HENRY","ELSIE",
        "AILEEN","DEXTER","FLORENDO","GIEZEL","JELLIE","JENNIFER","KENNETH","LOVELY","MARK HENRY","NIKKA","SHIERWIN"
      ],
      "San Jose": [
        "CHRISTINE","BEVERLY","PHILIP","BRYAN","YVES",
        "ANNE MARIE","ARLYN","BREENJAMIL","COLLEEN","JESSICA","JET","JIM","MAY","FELIX","ROVIE","ROWELL"
      ]
    };

    // 🖼️ Teacher photo URLs
    const teacherPhotos = Object.fromEntries(
      Object.entries(teacherMap).flatMap(([campus, list]) =>
        list.map(name => [
          name,
          `https://raw.githubusercontent.com/iTHRIVE-Mich/ithrive-pwa/main/${encodeURIComponent(name)}.png`
        ])
      )
    );

    // 🌐 Expose data globally
    window._ithrive = {
      db,
      teacherMap,
      teacherPhotos,
      async saveVibeCheck(answers) {
        const scores = Object.values(answers);
        const avgScore = scores.reduce((a,b)=>a+b,0) / scores.length;
        await addDoc(collection(db, "vibeChecks"), {
          teacherName: window.selectedTeacher,
          teacherCampus: window.selectedCampus,
          answers,
          avgScore,
          ts: serverTimestamp()
        });
      },
      async renderLeaderboard() {
        const startDate = new Date("2025-07-21T00:00:00");
        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate()+14);
        const q = query(
          collection(db, "vibeChecks"),
          where("ts", ">=", Timestamp.fromDate(startDate)),
          where("ts", "<", Timestamp.fromDate(endDate))
        );
        const snap = await getDocs(q);
        const agg = {};
        snap.forEach(doc => {
          const { teacherName, teacherCampus, answers } = doc.data();
          const extreme = Object.values(answers || {}).filter(v => v===1 || v===4);
          if (!extreme.length) return;
          const sum = extreme.reduce((s,v)=>s+v,0);
          const cnt = extreme.length;
          if (!agg[teacherName]) agg[teacherName] = { sum:0, cnt:0, campus:teacherCampus };
          agg[teacherName].sum += sum;
          agg[teacherName].cnt += cnt;
        });
        const top5 = Object.entries(agg)
          .map(([name,{sum,cnt,campus}]) => ({ name, campus, avg: sum/cnt }))
          .sort((a,b)=>b.avg-a.avg)
          .slice(0,5);
        const ol = document.getElementById("leaderboard-list");
        ol.innerHTML = "";
        top5.forEach(({name,campus},i) => {
          const li = document.createElement("li");
          li.innerHTML = `
            <img src="${teacherPhotos[name]}" alt="${name}" class="leader-img"/>
            <div class="leader-info">
              <div class="leader-name">${name}</div>
              <div class="leader-campus">${campus}</div>
            </div>
            <div class="leader-rank">${i+1}</div>`;
          ol.appendChild(li);
        });
      }
    };
  </script>
</head>

<body>
  <div class="layout">
    <!-- HEADER, PAGES, AND HTML STRUCTURE (KEEP YOUR EXISTING) -->
  </div>

  <script>
    // Navigation and teacher rendering
    function goTo(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id === 'page-teacher') showTeachers();
      if (id === 'page-leaderboard' && window._ithrive) window._ithrive.renderLeaderboard();
    }
    document.getElementById('splashBtn').onclick = () => goTo('page-campus');

    document.querySelectorAll('.campus-thumb').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.campus-thumb').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        window.selectedCampus = el.dataset.campus;
        goTo('page-teacher');
      };
    });

    function showTeachers() {
      const grid = document.getElementById('teacher-list');
      grid.innerHTML = '';
      const list = window._ithrive.teacherMap[window.selectedCampus] || [];
      list.forEach(name => {
        const btn = document.createElement('button');
        btn.onclick = () => { window.selectedTeacher = name; goTo('page-questions'); };
        const src = window._ithrive.teacherPhotos[name];
        btn.innerHTML = `<img src="${src}" alt="${name}"/><div>${name}</div>`;
        grid.appendChild(btn);
      });
    }

    // Language, rating, and feedback
    const answers = {};
    document.getElementById('langSelect').addEventListener('change', e => {
      document.querySelectorAll('.question').forEach(el => el.textContent = el.dataset[e.target.value]);
    });
    document.getElementById('langSelect').dispatchEvent(new Event('change'));

    document.querySelectorAll('.emoji-row').forEach(row => {
      row.addEventListener('click', e => {
        if (!e.target.matches('.emoji-btn')) return;
        row.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
        e.target.classList.add('selected');
        answers[row.closest('.question-block').dataset.code] = parseInt(e.target.dataset.rating, 10);
      });
    });

    document.getElementById("feedbackSubmitBtn").addEventListener("click", async () => {
      const hype = parseInt(document.getElementById("stars").value, 10);
      if (!hype) return alert("Please select a star rating.");
      if (Object.keys(answers).length < 6) return alert("Please tap an emoji for all six questions.");
      try {
        await window._ithrive.saveVibeCheck(answers);
        const { addDoc, collection, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");
        await addDoc(collection(window._ithrive.db, "vibeChecks"), {
          teacherName: window.selectedTeacher,
          teacherCampus: window.selectedCampus,
          hypeRating: hype,
          ts: serverTimestamp()
        });
        document.querySelector('#page-questions .thanks-msg').style.display = 'block';
        document.getElementById("feedbackForm").style.display = "none";
      } catch (err) {
        console.error(err);
        alert("Error saving. Please try again.");
      }
    });
  </script>
</body>
</html>
